# WVmp 默认保护配置（P8 泳道示例；schema 见 cli/include/wvmp/cli/config.hpp）。
#
# input  / output : 输入与输出 PE 路径（必填）
# seed            : 保护随机种子（可省略，默认 0）
# [[passes]]      : 按 Phase 语义书写即可（Load -> Analyze -> Transform ->
#                   Emit -> Write）；Pipeline 装配时按 Phase 稳定排序，
#                   同一 Phase 内保持此处的配置顺序。

input  = "target.exe"
output = "target_protected.exe"
seed   = 12345

[[passes]]
name = "pe_loader"
[[passes]]
name = "marker_scan"
[[passes]]
name = "lifter"
[[passes]]
name = "virtualize"
[[passes]]
name = "stub_link"
[[passes]]
name = "pe_writer"

# MIT-541 水印溯源 v1（可省略 = 不嵌水印；详细值域见 docs/WATERMARK_TRACING_DESIGN.md）：
#   [watermark]
#   id     = "Customer_A"          # 发行对象标识（缺省 = value 前 8 字符）
#   value  = "4D5A90??11223344"    # 十六进制 + '?' 通配符，16-64 字符，固定位 >= 12
#   copies = 3                     # 嵌入份数 1-8（抗局部篡改冗余）
#   issue_log = "watermark_issues.tsv"  # 发行台账（TSV；泄露后 wvmp scan 反查）
# 泄露副本反查：wvmp scan --in leaked.exe --registry watermarks.toml
